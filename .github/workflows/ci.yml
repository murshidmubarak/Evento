name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend (Type-Check, Test, Build)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MongoDB 8.0 Single-Node Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 \
            -e GLIBC_TUNABLES="glibc.pthread.rseq=1" \
            mongo:8.0 --replSet rs0 --bind_ip_all
          echo "Waiting for MongoDB daemon to respond to ping..."
          for i in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 1
          done
          echo "Initiating replica set rs0..."
          docker exec mongodb mongosh --quiet --eval '
            var status;
            try { status = rs.status(); } catch (e) {}
            if (!status || status.ok !== 1) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] });
            }
          '
          echo "Waiting for replica set primary to be elected..."
          PRIMARY_READY=0
          for i in {1..30}; do
            IS_PRIMARY=$(docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null || true)
            if [ "$IS_PRIMARY" = "true" ]; then
              echo "✅ MongoDB 8.0 Replica Set rs0 is ready and primary!"
              PRIMARY_READY=1
              break
            fi
            sleep 1
          done
          if [ "$PRIMARY_READY" -ne 1 ]; then
            echo "❌ Failed to elect primary in MongoDB replica set within 30 seconds"
            docker logs mongodb
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript type-check
        working-directory: backend
        run: npm run type-check

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/eventops_test?replicaSet=rs0&directConnection=true
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/eventops_test?replicaSet=rs0&directConnection=true
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters
          JWT_EXPIRES_IN: 1d
          PASSWORD_RESET_EXPIRES_IN_MINS: 15
          RAZORPAY_KEY_ID: rzp_test_dummy_key_id
          RAZORPAY_KEY_SECRET: dummy_secret
          RAZORPAY_WEBHOOK_SECRET: test_webhook_secret
          FRONTEND_URL: http://localhost:5173
          CLOUDINARY_CLOUD_NAME: test_cloud
          CLOUDINARY_API_KEY: test_key
          CLOUDINARY_API_SECRET: test_secret
          EMAIL_FROM: noreply@example.com
          EMAIL_VERIFICATION_OTP_TTL_MINUTES: 15
          EMAIL_VERIFICATION_OTP_MAX_ATTEMPTS: 5
          EMAIL_VERIFICATION_OTP_RESEND_COOLDOWN_SECONDS: 60
          SMTP_USER: ""
          SMTP_PASS: ""
          ENABLE_REMINDER_SCHEDULER: false
        run: npm test

      - name: Build backend production bundle
        working-directory: backend
        run: npm run build

      - name: Teardown MongoDB container
        if: always()
        run: |
          docker stop mongodb 2>/dev/null || true
          docker rm mongodb 2>/dev/null || true

  frontend-ci:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm test

      - name: Build frontend production bundle
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build
